<!doctype html>
<html>
<head><meta charset="utf-8"><title>RowList</title>
<style>
  body{margin:0;padding:24px;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:24px;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .panel{background:var(--bg-panel);padding:20px;}
  .cap{font:400 11px/1.4 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--text-meta);margin:0 0 8px;}
.t{font:400 22px/1.1 var(--font-serif);letter-spacing:-.015em;margin:0}
</style>
</head>
<body>
<div id="r"></div>
<script>
  var L = window.LB, h = React.createElement;
  function row(n, t, m){ return h('div', {className:'row', style:{justifyContent:'space-between'}}, h('p', {className:'t'}, n + '  ' + t), h(L.Label, {variant:'meta'}, m)); }
  ReactDOM.createRoot(document.getElementById('r')).render(h(L.RowList, null,
    row('01', 'Wolters Kluwer', 'Ecosystem and AI'), row('02', 'Movistar', 'Self-service'), row('03', 'Lab', 'AI experiments')));
</script>
</body>
</html>
